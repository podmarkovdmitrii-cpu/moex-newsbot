name: Проверка идей для модели аномалий (история с 2008 г.)

on:
  workflow_dispatch:
    inputs:
      years:
        description: 'Сколько последних лет проверять (обучение на всех предыдущих)'
        default: '10'
      exp:
        description: 'Какая проверка: 1 — группы признаков (E1–E6), 2 — время публикации и способы обучения, 3 — идеи из других областей, 4 — потоки денег и идеи из статей/форумов'
        default: '1'
      parts:
        description: 'Только эти части проверки №2, JSON-список (например ["g"]); пусто — все'
        default: ''

concurrency:
  group: anomaly-model
  cancel-in-progress: false

jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    strategy:
      fail-fast: false
      # проверка №2 — 6 параллельных частей (каждая со своей базой), иначе 18 лет истории не помещаются в лимит 6 часов
      matrix:
        part: ${{ fromJSON(inputs.parts != '' && inputs.parts || (inputs.exp == '4' && '["a","b","c","d","e"]' || (inputs.exp != '1' && '["a","b","c","d","e","f","g"]' || '["all"]'))) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Библиотеки
        run: pip install --quiet "scikit-learn==1.5.2" pandas numpy matplotlib lightgbm
      - name: Кэш исторических свечей (тот же, что у обучения модели)
        uses: actions/cache/restore@v4
        with:
          path: anomaly-data
          key: anomaly-data-${{ github.run_id }}
          restore-keys: anomaly-data-
      - name: Журнал новостей бота
        uses: actions/cache/restore@v4
        with:
          path: newsbot-state
          key: newsbot-state-${{ github.run_id }}
          restore-keys: newsbot-state-
      - name: Проверка идей на годах, которых модель не видела
        env:
          ANOM_DATA: ${{ github.workspace }}/anomaly-data
          ANOM_MODELS: ${{ github.workspace }}/anomaly-exp
          NEWS_STATE: ${{ github.workspace }}/newsbot-state
          CHANNEL_STATE: ${{ github.workspace }}/tmp-state
          EXP_YEARS: ${{ inputs.years }}
          EXP_BUDGET_MIN: '320'
          EXP_PART: ${{ matrix.part }}
        run: python newsbot/anomaly/${{ inputs.exp == '4' && 'exp4.py' || (inputs.exp == '3' && 'exp3.py' || (inputs.exp == '2' && 'exp2.py' || 'experiment.py')) }}
      - name: Отчёт (файл)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exp-report-${{ matrix.part }}
          path: anomaly-exp/exp*.json
          if-no-files-found: ignore
      - name: Сохранить свечи и историю срочного рынка
        if: ${{ always() && (matrix.part == 'all' || (matrix.part == 'g' && inputs.exp == '2')) }}
        uses: actions/cache/save@v4
        with:
          path: anomaly-data
          key: anomaly-data-${{ github.run_id }}
