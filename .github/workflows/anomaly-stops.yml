name: "Проверка №23 — как лучше ставить стоп и тейк: история ликвидных акций 2008–2026"

on:
  workflow_dispatch:

concurrency:
  group: anomaly-stops
  cancel-in-progress: false

jobs:
  stops:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet "scikit-learn==1.5.2" pandas numpy scipy matplotlib
      - uses: actions/cache/restore@v4
        with:
          path: anomaly-data
          key: anomaly-data-${{ github.run_id }}
          restore-keys: anomaly-data-
      - uses: actions/cache/restore@v4
        with:
          path: newsbot-state
          key: newsbot-state-${{ github.run_id }}
          restore-keys: newsbot-state-
      - name: "Стопы и тейки: ATR, %, за уровнем × 1–5R, частичные, по сроку; выбор 2008–2019, проверка 2020–2026"
        env:
          ANOM_DATA: ${{ github.workspace }}/anomaly-data
          ANOM_MODELS: ${{ github.workspace }}/anomaly-exp
          NEWS_STATE: ${{ github.workspace }}/newsbot-state
          CHANNEL_STATE: ${{ github.workspace }}/tmp-state
          EXP_EV_SUB: "8"
        run: python newsbot/anomaly/exp23.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exp23-report
          path: anomaly-exp/exp23_report.json
          if-no-files-found: ignore
