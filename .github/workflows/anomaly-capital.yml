name: "Проверка №25 — рост капитала по годам для правила сканера (портфель без плеча)"

on:
  workflow_dispatch:

concurrency:
  group: anomaly-capital
  cancel-in-progress: false

jobs:
  capital:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet "scikit-learn==1.5.2" pandas numpy scipy matplotlib
      - uses: actions/cache/restore@v4
        with:
          path: anomaly-data
          key: anomaly-data-${{ github.run_id }}
          restore-keys: anomaly-data-
      - uses: actions/cache/restore@v4
        with:
          path: newsbot-state
          key: newsbot-state-${{ github.run_id }}
          restore-keys: newsbot-state-
      - name: "Портфель: до 5/10 позиций, риск 0,5/1% на сделку, 2009–2026"
        env:
          ANOM_DATA: ${{ github.workspace }}/anomaly-data
          ANOM_MODELS: ${{ github.workspace }}/anomaly-exp
          NEWS_STATE: ${{ github.workspace }}/newsbot-state
          CHANNEL_STATE: ${{ github.workspace }}/tmp-state
        run: python newsbot/anomaly/exp25.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exp25-report
          path: anomaly-exp/exp25_report.json
          if-no-files-found: ignore
