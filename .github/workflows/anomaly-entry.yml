name: Проверка №11 — точки входа и уровни для аномалий

on:
  workflow_dispatch:

concurrency:
  group: anomaly-entry
  cancel-in-progress: false

jobs:
  entry:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet "scikit-learn==1.5.2" pandas numpy scipy matplotlib
      - uses: actions/cache/restore@v4
        with:
          path: anomaly-data
          key: anomaly-data-${{ github.run_id }}
          restore-keys: anomaly-data-
      - uses: actions/cache/restore@v4
        with:
          path: newsbot-state
          key: newsbot-state-${{ github.run_id }}
          restore-keys: newsbot-state-
      - uses: actions/cache/restore@v4
        with:
          path: channel-state
          key: channel-state-${{ github.run_id }}
          restore-keys: channel-state-
      - name: Входы, уровни «дойдёт до» и продолжения, результативность (2020–2026)
        env:
          ANOM_DATA: ${{ github.workspace }}/anomaly-data
          ANOM_MODELS: ${{ github.workspace }}/anomaly-exp
          NEWS_STATE: ${{ github.workspace }}/newsbot-state
          CHANNEL_STATE: ${{ github.workspace }}/tmp-state
          CHANNEL_STATE_DIR: ${{ github.workspace }}/channel-state
        run: python newsbot/anomaly/exp11.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exp11-report
          path: anomaly-exp/exp11_report.json
          if-no-files-found: ignore
