name: Новостной бот (почти в реальном времени)

on:
  # Бот работает непрерывно: каждый запуск держится ~110 минут (новости каждые 75 с, посты паблика по расписанию из
  # channel/jobs.py), в конце сохраняет состояние и сам запускает следующий (workflow_dispatch). Расписание GitHub ниже —
  # только «сторож»: если цепочка оборвалась, ближайший срабатывающий cron её перезапустит. Остановить цепочку —
  # переменная репозитория BOT_CHAIN = off (Settings → Secrets and variables → Actions → Variables).
  schedule:
    - cron: '4,34 * * * *'
  push:
    paths:
      - '.github/workflows/news-bot.yml'   # после изменения этого файла цепочка стартует сразу
  workflow_dispatch:

concurrency:
  group: newsbot
  cancel-in-progress: false

permissions:
  actions: write
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 135
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Библиотека для картинок к новостям
        run: pip install --quiet matplotlib reportlab "scikit-learn==1.5.2" pandas numpy
      - name: Сертификаты НУЦ Минцифры (нужны для API Т-Пульса)
        continue-on-error: true
        run: |
          for f in russian_trusted_root_ca_pem.crt russian_trusted_sub_ca_pem.crt; do
            curl -sSfL --max-time 30 "https://gu-st.ru/content/lending/$f" >> "$RUNNER_TEMP/ru_ca.pem" && echo >> "$RUNNER_TEMP/ru_ca.pem"
          done
      - name: Модели прогноза аномалий
        uses: actions/cache/restore@v4
        with:
          path: anomaly-models
          key: anomaly-models-${{ github.run_id }}
          restore-keys: anomaly-models-
      - name: Восстановить состояние бота
        uses: actions/cache/restore@v4
        with:
          path: newsbot-state
          key: newsbot-state-${{ github.run_id }}
          restore-keys: newsbot-state-
      - name: Состояние паблика
        uses: actions/cache/restore@v4
        with:
          path: channel-state
          key: channel-state-${{ github.run_id }}
          restore-keys: channel-state-
      - name: Результаты исследований (толпа, смежные бумаги, выходные)
        uses: actions/cache/restore@v4
        with:
          path: research-stats
          key: research-stats-${{ github.run_id }}
          restore-keys: research-stats-
      - name: Новости, сделки и посты паблика по расписанию
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_PUBLIC_TOKEN: ${{ secrets.TG_PUBLIC_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          TG_NEWS_CHAT_ID: ${{ secrets.TG_NEWS_CHAT_ID }}
          STATE_DIR: ${{ github.workspace }}/newsbot-state
          BOT_CAPITAL: '100000'
          NEWS_PER_DAY: '30'
          TG_PUBLIC_CHAT: ${{ vars.TG_PUBLIC_CHAT }}
          PUBLIC_PER_DAY: '40'
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL || 'https://lenec.tech' }}
          LLM_MODEL: ${{ vars.LLM_MODEL || 'claude-opus-5-5' }}
          LLM_AUTH: ${{ vars.LLM_AUTH }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          ANOM_MODELS: ${{ github.workspace }}/anomaly-models
          PYTHON: python
          NEWS_LOOP_MIN: '110'
          CHANNEL_SCHED: '1'
          CHANNEL_STATE_DIR: ${{ github.workspace }}/channel-state
          RESEARCH_STATS: ${{ github.workspace }}/research-stats
          TELEGRAPH_TOKEN: ${{ secrets.TELEGRAPH_TOKEN }}
          NEWS_LOOP_SEC: '75'
          ANOMALY_EVERY_MIN: '5'
          PULSE_EVERY_MIN: '15'
          SHAKE_EVERY_MIN: '10'
          RU_CA: ${{ runner.temp }}/ru_ca.pem
          LLM_NEWS_PER_DAY: '45'
          # закрытые идеи с оплатой доступа (newsbot/channel/paywall.py)
          IDEA_ADMINS: ${{ vars.IDEA_ADMINS }}
          IDEA_SITE_URL: ${{ vars.IDEA_SITE_URL }}
          PAY_PROVIDER_TOKEN: ${{ secrets.PAY_PROVIDER_TOKEN }}
          PAY_CURRENCY: ${{ vars.PAY_CURRENCY || 'RUB' }}
          PAY_PRICE: ${{ vars.PAY_PRICE || '500' }}
          PAY_DAYS: ${{ vars.PAY_DAYS || '30' }}
          PAY_RECEIPT: ${{ vars.PAY_RECEIPT || '1' }}
          PAY_VAT_CODE: ${{ vars.PAY_VAT_CODE || '1' }}
        run: |
          BOT=$(find . -name bot.js -path '*newsbot*' | head -1)
          if [ -z "$BOT" ]; then echo "Не найден newsbot/bot.js — загрузите папку newsbot в репозиторий"; exit 1; fi
          PW=$(find . -name paywall.py -path '*newsbot/channel*' | head -1)
          if [ -n "$PW" ] && [ "${{ vars.IDEAS }}" != "off" ]; then python "$PW" & PWPID=$!; fi
          rc=0; node "$BOT" || rc=$?
          if [ -n "$PWPID" ]; then kill -TERM "$PWPID" 2>/dev/null; wait "$PWPID" 2>/dev/null || true; fi
          exit $rc
      - name: Сохранить состояние бота
        if: always()
        uses: actions/cache/save@v4
        with:
          path: newsbot-state
          key: newsbot-state-${{ github.run_id }}
      - name: Сохранить состояние паблика
        if: always()
        uses: actions/cache/save@v4
        with:
          path: channel-state
          key: channel-state-${{ github.run_id }}
      - name: Запустить следующий цикл (бот работает без перерывов)
        if: ${{ !cancelled() && vars.BOT_CHAIN != 'off' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run news-bot.yml --repo "${{ github.repository }}" --ref "${{ github.ref_name }}"
