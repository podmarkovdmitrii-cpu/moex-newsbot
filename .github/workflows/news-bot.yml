name: Новостной бот (почти в реальном времени)

on:
  schedule:
    - cron: '*/30 4-20 * * 1-5'   # будни 07:00–23:55 МСК: каждый запуск держится ~26 минут и проверяет каналы каждые 75 секунд
    - cron: '7 6-18/3 * * 0,6'    # выходные: новости раз в 3 часа
  workflow_dispatch:

concurrency:
  group: newsbot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Библиотека для картинок к новостям
        run: pip install --quiet matplotlib
      - name: Восстановить состояние бота
        uses: actions/cache/restore@v4
        with:
          path: newsbot-state
          key: newsbot-state-${{ github.run_id }}
          restore-keys: newsbot-state-
      - name: Новости и сделки
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_PUBLIC_TOKEN: ${{ secrets.TG_PUBLIC_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          TG_NEWS_CHAT_ID: ${{ secrets.TG_NEWS_CHAT_ID }}
          STATE_DIR: ${{ github.workspace }}/newsbot-state
          BOT_CAPITAL: '100000'
          NEWS_PER_DAY: '30'
          TG_PUBLIC_CHAT: ${{ vars.TG_PUBLIC_CHAT }}
          PUBLIC_PER_DAY: '40'
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL || 'https://lenec.tech' }}
          LLM_MODEL: ${{ vars.LLM_MODEL || 'claude-opus-5-5' }}
          LLM_AUTH: ${{ vars.LLM_AUTH }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          PYTHON: python
          NEWS_LOOP_MIN: ${{ github.event.schedule == '7 6-18/3 * * 0,6' && '0' || '26' }}
          NEWS_LOOP_SEC: '75'
          ANOMALY_EVERY_MIN: '5'
          LLM_NEWS_PER_DAY: '45'
        run: |
          BOT=$(find . -name bot.js -path '*newsbot*' | head -1)
          if [ -z "$BOT" ]; then echo "Не найден newsbot/bot.js — загрузите папку newsbot в репозиторий"; exit 1; fi
          node "$BOT"
      - name: Сохранить состояние бота
        if: always()
        uses: actions/cache/save@v4
        with:
          path: newsbot-state
          key: newsbot-state-${{ github.run_id }}
