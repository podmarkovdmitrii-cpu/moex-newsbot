name: Новостной бот (почти в реальном времени)

on:
  schedule:
    - cron: '4,34 * * * 1-5'      # будни круглосуточно (минуты 04 и 34 — GitHub реже пропускает запуски не в начале часа) (и ночью — для утреннего плана): каждый запуск держится ~26 минут и проверяет каналы каждые 75 секунд
    - cron: '17 */2 * * 0,6'       # выходные: новости раз в 2 часа (попадут в план понедельника)
  workflow_dispatch:

concurrency:
  group: newsbot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Библиотека для картинок к новостям
        run: pip install --quiet matplotlib
      - name: Сертификаты НУЦ Минцифры (нужны для API Т-Пульса)
        continue-on-error: true
        run: |
          for f in russian_trusted_root_ca_pem.crt russian_trusted_sub_ca_pem.crt; do
            curl -sSfL --max-time 30 "https://gu-st.ru/content/lending/$f" >> "$RUNNER_TEMP/ru_ca.pem" && echo >> "$RUNNER_TEMP/ru_ca.pem"
          done
      - name: Восстановить состояние бота
        uses: actions/cache/restore@v4
        with:
          path: newsbot-state
          key: newsbot-state-${{ github.run_id }}
          restore-keys: newsbot-state-
      - name: Новости и сделки
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_PUBLIC_TOKEN: ${{ secrets.TG_PUBLIC_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          TG_NEWS_CHAT_ID: ${{ secrets.TG_NEWS_CHAT_ID }}
          STATE_DIR: ${{ github.workspace }}/newsbot-state
          BOT_CAPITAL: '100000'
          NEWS_PER_DAY: '30'
          TG_PUBLIC_CHAT: ${{ vars.TG_PUBLIC_CHAT }}
          PUBLIC_PER_DAY: '40'
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL || 'https://lenec.tech' }}
          LLM_MODEL: ${{ vars.LLM_MODEL || 'claude-opus-5-5' }}
          LLM_AUTH: ${{ vars.LLM_AUTH }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          PYTHON: python
          NEWS_LOOP_MIN: ${{ github.event.schedule == '17 */2 * * 0,6' && '0' || '26' }}
          NEWS_LOOP_SEC: '75'
          ANOMALY_EVERY_MIN: '5'
          PULSE_EVERY_MIN: '15'
          RU_CA: ${{ runner.temp }}/ru_ca.pem
          LLM_NEWS_PER_DAY: '45'
        run: |
          BOT=$(find . -name bot.js -path '*newsbot*' | head -1)
          if [ -z "$BOT" ]; then echo "Не найден newsbot/bot.js — загрузите папку newsbot в репозиторий"; exit 1; fi
          node "$BOT"
      - name: Сохранить состояние бота
        if: always()
        uses: actions/cache/save@v4
        with:
          path: newsbot-state
          key: newsbot-state-${{ github.run_id }}
