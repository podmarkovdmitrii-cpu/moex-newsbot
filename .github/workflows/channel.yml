name: Паблик (план дня, потоки, ОФЗ, итоги, обзор бумаги, выходные)

on:
  # Плановые посты теперь публикует постоянно работающий бот (news-bot.yml → bot.js channelTick → channel/jobs.py по SCHED):
  # расписание GitHub запаздывало на часы, и посты выходили пачкой. Здесь остался только ручной запуск.
  workflow_dispatch:
    inputs:
      mode:
        description: 'Что опубликовать'
        required: true
        default: 'morning'
        type: choice
        options: [tg_check, test_post, aitest, anom_test, anom_pre, morning_dry, evening_dry, trader_prep_dry, trader_open_dry, trader_week_dry, anomaly, commod, morning, flows, ofz, pulse_deals, evening, weekly, trader_prep, trader_open, trader_week, stock_review, stock_review_dry, weekend_review, weekend_review_dry, monday_anom, monday_anom_dry, paper_report, flows_dry]

concurrency:
  group: channel
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Библиотеки
        run: pip install --quiet matplotlib reportlab "scikit-learn==1.5.2" pandas numpy
      - name: Сертификаты НУЦ Минцифры (нужны для API Т-Пульса)
        continue-on-error: true
        run: |
          for f in russian_trusted_root_ca_pem.crt russian_trusted_sub_ca_pem.crt; do
            curl -sSfL --max-time 30 "https://gu-st.ru/content/lending/$f" >> "$RUNNER_TEMP/ru_ca.pem" && echo >> "$RUNNER_TEMP/ru_ca.pem"
          done
          grep -c "BEGIN CERTIFICATE" "$RUNNER_TEMP/ru_ca.pem" || true
      - name: Модели прогноза аномалий
        uses: actions/cache/restore@v4
        with:
          path: anomaly-models
          key: anomaly-models-${{ github.run_id }}
          restore-keys: anomaly-models-
      - name: Состояние новостного бота (сигналы стратегии, новости)
        uses: actions/cache/restore@v4
        with:
          path: newsbot-state
          key: newsbot-state-${{ github.run_id }}
          restore-keys: newsbot-state-
      - name: Состояние паблика
        uses: actions/cache/restore@v4
        with:
          path: channel-state
          key: channel-state-${{ github.run_id }}
          restore-keys: channel-state-
      - name: Результаты исследований (толпа, смежные бумаги, выходные)
        uses: actions/cache/restore@v4
        with:
          path: research-stats
          key: research-stats-${{ github.run_id }}
          restore-keys: research-stats-
      - name: Публикация
        env:
          RESEARCH_STATS: ${{ github.workspace }}/research-stats
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_PUBLIC_TOKEN: ${{ secrets.TG_PUBLIC_TOKEN }}
          TG_PUBLIC_CHAT: ${{ vars.TG_PUBLIC_CHAT }}
          MODE: ${{ github.event.inputs.mode }}
          MONDAY_ANOM_ANYDAY: ${{ github.event.inputs.mode == 'monday_anom_dry' && '1' || '' }}
          SCHED: ${{ github.event.schedule }}
          NEWS_STATE: ${{ github.workspace }}/newsbot-state
          CHANNEL_STATE: ${{ github.workspace }}/channel-state
          RU_CA: ${{ runner.temp }}/ru_ca.pem
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL || 'https://lenec.tech' }}
          LLM_MODEL: ${{ vars.LLM_MODEL || 'claude-opus-5-5' }}
          LLM_AUTH: ${{ vars.LLM_AUTH }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          ANOM_MODELS: ${{ github.workspace }}/anomaly-models
          TELEGRAPH_TOKEN: ${{ secrets.TELEGRAPH_TOKEN }}
        run: python newsbot/channel/jobs.py
      - name: Сохранить состояние паблика
        if: always()
        uses: actions/cache/save@v4
        with:
          path: channel-state
          key: channel-state-${{ github.run_id }}
