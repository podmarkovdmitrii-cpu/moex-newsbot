name: Паблик (план дня, потоки, ОФЗ, итоги, статья недели)

on:
  schedule:
    - cron: '40 3 * * 1-5'       # 06:40 МСК — утренний торговый план (статья по секторам) + сырьё
    - cron: '30 5 * * 1'         # 08:30 МСК, понедельник — статья о базовых активах
    - cron: '*/30 7-15 * * 1-5'  # 10:00–18:30 МСК каждые 30 минут — перевес покупателей/продавцов и киты
    - cron: '50 15 * * 1-5'      # 18:50 МСК — перевес к закрытию основной сессии
    - cron: '45 10 * * 1-5'      # 13:45 МСК — ОФЗ, середина дня
    - cron: '10 16 * * 1-5'      # 19:10 МСК — ОФЗ, итоги дня
    - cron: '25 16 * * 1-5'      # 19:25 МСК — итоги дня
  workflow_dispatch:
    inputs:
      mode:
        description: 'Что опубликовать'
        required: true
        default: 'morning'
        type: choice
        options: [tg_check, test_post, aitest, anom_test, anom_pre, morning_dry, evening_dry, anomaly, commod, morning, flows, ofz, pulse_deals, evening, weekly]

concurrency:
  group: channel
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Библиотеки
        run: pip install --quiet matplotlib reportlab "scikit-learn==1.5.2" pandas numpy
      - name: Сертификаты НУЦ Минцифры (нужны для API Т-Пульса)
        continue-on-error: true
        run: |
          for f in russian_trusted_root_ca_pem.crt russian_trusted_sub_ca_pem.crt; do
            curl -sSfL --max-time 30 "https://gu-st.ru/content/lending/$f" >> "$RUNNER_TEMP/ru_ca.pem" && echo >> "$RUNNER_TEMP/ru_ca.pem"
          done
          grep -c "BEGIN CERTIFICATE" "$RUNNER_TEMP/ru_ca.pem" || true
      - name: Модели прогноза аномалий
        uses: actions/cache/restore@v4
        with:
          path: anomaly-models
          key: anomaly-models-${{ github.run_id }}
          restore-keys: anomaly-models-
      - name: Состояние новостного бота (сигналы стратегии, новости)
        uses: actions/cache/restore@v4
        with:
          path: newsbot-state
          key: newsbot-state-${{ github.run_id }}
          restore-keys: newsbot-state-
      - name: Состояние паблика
        uses: actions/cache/restore@v4
        with:
          path: channel-state
          key: channel-state-${{ github.run_id }}
          restore-keys: channel-state-
      - name: Публикация
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_PUBLIC_TOKEN: ${{ secrets.TG_PUBLIC_TOKEN }}
          TG_PUBLIC_CHAT: ${{ vars.TG_PUBLIC_CHAT }}
          MODE: ${{ github.event.inputs.mode }}
          SCHED: ${{ github.event.schedule }}
          NEWS_STATE: ${{ github.workspace }}/newsbot-state
          CHANNEL_STATE: ${{ github.workspace }}/channel-state
          RU_CA: ${{ runner.temp }}/ru_ca.pem
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL || 'https://lenec.tech' }}
          LLM_MODEL: ${{ vars.LLM_MODEL || 'claude-opus-5-5' }}
          LLM_AUTH: ${{ vars.LLM_AUTH }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          ANOM_MODELS: ${{ github.workspace }}/anomaly-models
          TELEGRAPH_TOKEN: ${{ secrets.TELEGRAPH_TOKEN }}
        run: python newsbot/channel/jobs.py
      - name: Сохранить состояние паблика
        if: always()
        uses: actions/cache/save@v4
        with:
          path: channel-state
          key: channel-state-${{ github.run_id }}
