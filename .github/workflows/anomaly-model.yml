name: Модель аномалий (обучение раз в неделю, история с 2008 г.)

on:
  schedule:
    - cron: '17 2 * * 0'   # воскресенье 05:17 МСК
  workflow_dispatch:
    inputs:
      report_only:
        description: 'Только прислать отчёт по последней модели (без обучения)'
        type: boolean
        default: false

concurrency:
  group: anomaly-model
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Библиотеки
        run: pip install --quiet "scikit-learn==1.5.2" pandas numpy matplotlib
      - name: Кэш исторических свечей (докачка)
        if: ${{ !inputs.report_only }}
        uses: actions/cache/restore@v4
        with:
          path: anomaly-data
          key: anomaly-data-${{ github.run_id }}
          restore-keys: anomaly-data-
      - name: Журнал новостей бота
        uses: actions/cache/restore@v4
        with:
          path: newsbot-state
          key: newsbot-state-${{ github.run_id }}
          restore-keys: newsbot-state-
      - name: Последняя обученная модель (режим «только отчёт»)
        if: ${{ inputs.report_only }}
        uses: actions/cache/restore@v4
        with:
          path: anomaly-models
          key: anomaly-models-${{ github.run_id }}
          restore-keys: anomaly-models-
      - name: Обучение и проверка на будущих годах
        if: ${{ !inputs.report_only }}
        env:
          ANOM_DATA: ${{ github.workspace }}/anomaly-data
          ANOM_MODELS: ${{ github.workspace }}/anomaly-models
          NEWS_STATE: ${{ github.workspace }}/newsbot-state
          CHANNEL_STATE: ${{ github.workspace }}/tmp-state
          ANOM_BUDGET_MIN: '180'
        run: python newsbot/anomaly/train.py
      - name: Часовые свечи до 2020 года (для модели-фильтра)
        if: ${{ success() && !inputs.report_only }}
        uses: actions/cache/restore@v4
        with:
          path: h-old
          key: h-old-v1-${{ github.run_id }}
          restore-keys: h-old-v1-
      - if: ${{ success() && !inputs.report_only }}
        uses: actions/cache/restore@v4
        with:
          path: anomaly-data/algopack/2020
          key: algopack-v2-2020-${{ github.run_id }}
          restore-keys: algopack-v2-2020-
      - if: ${{ success() && !inputs.report_only }}
        uses: actions/cache/restore@v4
        with:
          path: anomaly-data/algopack/2021
          key: algopack-v2-2021-${{ github.run_id }}
          restore-keys: algopack-v2-2021-
      - if: ${{ success() && !inputs.report_only }}
        uses: actions/cache/restore@v4
        with:
          path: anomaly-data/algopack/2022
          key: algopack-v2-2022-${{ github.run_id }}
          restore-keys: algopack-v2-2022-
      - if: ${{ success() && !inputs.report_only }}
        uses: actions/cache/restore@v4
        with:
          path: anomaly-data/algopack/2023
          key: algopack-v2-2023-${{ github.run_id }}
          restore-keys: algopack-v2-2023-
      - if: ${{ success() && !inputs.report_only }}
        uses: actions/cache/restore@v4
        with:
          path: anomaly-data/algopack/2024
          key: algopack-v2-2024-${{ github.run_id }}
          restore-keys: algopack-v2-2024-
      - if: ${{ success() && !inputs.report_only }}
        uses: actions/cache/restore@v4
        with:
          path: anomaly-data/algopack/2025
          key: algopack-v2-2025-${{ github.run_id }}
          restore-keys: algopack-v2-2025-
      - if: ${{ success() && !inputs.report_only }}
        uses: actions/cache/restore@v4
        with:
          path: anomaly-data/algopack/2026
          key: algopack-v2-2026-${{ github.run_id }}
          restore-keys: algopack-v2-2026-
      - name: Модель-фильтр для виртуального счёта (F4, F2 — проверки №17–18)
        if: ${{ success() && !inputs.report_only }}
        continue-on-error: true
        env:
          ANOM_DATA: ${{ github.workspace }}/anomaly-data
          ANOM_MODELS: ${{ github.workspace }}/anomaly-models
          NEWS_STATE: ${{ github.workspace }}/newsbot-state
          CHANNEL_STATE: ${{ github.workspace }}/tmp-state
          EXP_H_DIR: ${{ github.workspace }}/h-old
        run: |
          rc=0; python newsbot/anomaly/filter_fit.py || rc=$?
          rm -rf anomaly-data/algopack   # дневные ALGOPACK хранятся в своих кэшах — в кэш свечей их не кладём
          exit $rc
      - name: Модели — артефактом (новостной бот подхватит их сразу, не дожидаясь перезапуска)
        if: ${{ success() && !inputs.report_only }}
        uses: actions/upload-artifact@v4
        with:
          name: anomaly-models
          path: anomaly-models
          retention-days: 7
          include-hidden-files: false
      - name: Отчёт администратору (качество модели и ревизор связей)
        if: success()
        env:
          ANOM_MODELS: ${{ github.workspace }}/anomaly-models
          NEWS_STATE: ${{ github.workspace }}/newsbot-state
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          TG_PUBLIC_TOKEN: ${{ secrets.TG_PUBLIC_TOKEN }}
          IDEA_ADMINS: ${{ vars.IDEA_ADMINS || secrets.IDEA_ADMINS }}
        run: python newsbot/anomaly/report_tg.py
      - name: Сохранить свечи
        if: ${{ always() && !inputs.report_only }}
        uses: actions/cache/save@v4
        with:
          path: anomaly-data
          key: anomaly-data-${{ github.run_id }}
      - name: Сохранить модели
        if: ${{ always() && !inputs.report_only }}
        uses: actions/cache/save@v4
        with:
          path: anomaly-models
          key: anomaly-models-${{ github.run_id }}
