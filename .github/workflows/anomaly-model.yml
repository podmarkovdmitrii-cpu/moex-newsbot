name: Модель аномалий (обучение раз в неделю, история с 2008 г.)

on:
  schedule:
    - cron: '17 2 * * 0'   # воскресенье 05:17 МСК
  workflow_dispatch:
    inputs:
      report_only:
        description: 'Только прислать отчёт по последней модели (без обучения)'
        type: boolean
        default: false

concurrency:
  group: anomaly-model
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Библиотеки
        run: pip install --quiet "scikit-learn==1.5.2" pandas numpy matplotlib
      - name: Кэш исторических свечей (докачка)
        if: ${{ !inputs.report_only }}
        uses: actions/cache/restore@v4
        with:
          path: anomaly-data
          key: anomaly-data-${{ github.run_id }}
          restore-keys: anomaly-data-
      - name: Журнал новостей бота
        uses: actions/cache/restore@v4
        with:
          path: newsbot-state
          key: newsbot-state-${{ github.run_id }}
          restore-keys: newsbot-state-
      - name: Последняя обученная модель (режим «только отчёт»)
        if: ${{ inputs.report_only }}
        uses: actions/cache/restore@v4
        with:
          path: anomaly-models
          key: anomaly-models-${{ github.run_id }}
          restore-keys: anomaly-models-
      - name: Обучение и проверка на будущих годах
        if: ${{ !inputs.report_only }}
        env:
          ANOM_DATA: ${{ github.workspace }}/anomaly-data
          ANOM_MODELS: ${{ github.workspace }}/anomaly-models
          NEWS_STATE: ${{ github.workspace }}/newsbot-state
          CHANNEL_STATE: ${{ github.workspace }}/tmp-state
          ANOM_BUDGET_MIN: '180'
        run: python newsbot/anomaly/train.py
      - name: Отчёт администратору (качество модели и ревизор связей)
        if: success()
        env:
          ANOM_MODELS: ${{ github.workspace }}/anomaly-models
          NEWS_STATE: ${{ github.workspace }}/newsbot-state
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          TG_PUBLIC_TOKEN: ${{ secrets.TG_PUBLIC_TOKEN }}
          IDEA_ADMINS: ${{ vars.IDEA_ADMINS || secrets.IDEA_ADMINS }}
        run: python newsbot/anomaly/report_tg.py
      - name: Сохранить свечи
        if: ${{ always() && !inputs.report_only }}
        uses: actions/cache/save@v4
        with:
          path: anomaly-data
          key: anomaly-data-${{ github.run_id }}
      - name: Сохранить модели
        if: ${{ always() && !inputs.report_only }}
        uses: actions/cache/save@v4
        with:
          path: anomaly-models
          key: anomaly-models-${{ github.run_id }}
