name: "Проверка №24 — вечерний сканер сделок (стоп за уровнем, цель 5R) и модель для бота идей"

on:
  workflow_dispatch:

concurrency:
  group: anomaly-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet "scikit-learn==1.5.2" pandas numpy scipy matplotlib
      - uses: actions/cache/restore@v4
        with:
          path: anomaly-data
          key: anomaly-data-${{ github.run_id }}
          restore-keys: anomaly-data-
      - uses: actions/cache/restore@v4
        with:
          path: newsbot-state
          key: newsbot-state-${{ github.run_id }}
          restore-keys: newsbot-state-
      - name: Последние модели аномалий (модель сканера добавляется к ним)
        uses: actions/cache/restore@v4
        with:
          path: anomaly-models
          key: anomaly-models-${{ github.run_id }}
          restore-keys: anomaly-models-
      - name: "Сканер: обучение по годам, выбор порога 2014–2019, проверка 2020–2026"
        env:
          ANOM_DATA: ${{ github.workspace }}/anomaly-data
          ANOM_MODELS: ${{ github.workspace }}/anomaly-models
          NEWS_STATE: ${{ github.workspace }}/newsbot-state
          CHANNEL_STATE: ${{ github.workspace }}/tmp-state
        run: python newsbot/anomaly/exp24.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exp24-report
          path: anomaly-models/exp24_report.json
          if-no-files-found: ignore
      - name: Модели — артефактом (бот подхватит модель сканера), только если проверка пройдена
        if: hashFiles('anomaly-models/scan_model.pkl') != '' && hashFiles('anomaly-models/meta.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: anomaly-models
          path: anomaly-models
          retention-days: 7
          include-hidden-files: false
      - name: Сохранить модели
        if: hashFiles('anomaly-models/scan_model.pkl') != ''
        uses: actions/cache/save@v4
        with:
          path: anomaly-models
          key: anomaly-models-${{ github.run_id }}
