name: Исследования на истории 2008–2026 (толпа, смежные бумаги, выходные), обучение на разных промежутках и независимая проверка

on:
  push:
    paths:
      - 'newsbot/research/**'
  schedule:
    - cron: '7 4 * * 6'   # суббота 07:07 МСК — пересчёт на свежих данных недели
  workflow_dispatch:

concurrency:
  group: research
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Библиотеки
        run: pip install --quiet "scikit-learn==1.5.2" pandas numpy matplotlib
      - name: Кэш исторических свечей (из обучения модели аномалий)
        uses: actions/cache/restore@v4
        with:
          path: anomaly-data
          key: anomaly-data-${{ github.run_id }}
          restore-keys: anomaly-data-
      - name: История свечей до 2012 г. (докачка с Мосбиржи для исследований)
        uses: actions/cache/restore@v4
        with:
          path: research-hist
          key: research-hist-${{ github.run_id }}
          restore-keys: research-hist-
      - name: Журнал новостей бота
        uses: actions/cache/restore@v4
        with:
          path: newsbot-state
          key: newsbot-state-${{ github.run_id }}
          restore-keys: newsbot-state-
      - name: Архив новостей Интерфакса с 2008 г. (заголовки) и разметка словарём бота
        continue-on-error: true
        env:
          RESEARCH_DIR: ${{ github.workspace }}/research-stats
          RESEARCH_HIST: ${{ github.workspace }}/research-hist
        run: |
          python newsbot/research/news_hist.py
          node newsbot/research/ifx_events.js
      - name: Исследование (study.py)
        env:
          ANOM_DATA: ${{ github.workspace }}/anomaly-data
          NEWS_STATE: ${{ github.workspace }}/newsbot-state
          CHANNEL_STATE: ${{ github.workspace }}/tmp-state
          RESEARCH_DIR: ${{ github.workspace }}/research-stats
          RESEARCH_HIST: ${{ github.workspace }}/research-hist
          PYTHONWARNINGS: ignore
        run: python newsbot/research/study.py
      - name: Сохранить докачанную историю
        if: always()
        uses: actions/cache/save@v4
        with:
          path: research-hist
          key: research-hist-${{ github.run_id }}
      - name: Обучение на разных промежутках и проверка на следующих годах (walkforward.py)
        env:
          ANOM_DATA: ${{ github.workspace }}/anomaly-data
          NEWS_STATE: ${{ github.workspace }}/newsbot-state
          CHANNEL_STATE: ${{ github.workspace }}/tmp-state
          RESEARCH_DIR: ${{ github.workspace }}/research-stats
          RESEARCH_HIST: ${{ github.workspace }}/research-hist
          PYTHONWARNINGS: ignore
        run: python newsbot/research/walkforward.py
      - name: Агент-проверяющий (verify.py)
        env:
          ANOM_DATA: ${{ github.workspace }}/anomaly-data
          NEWS_STATE: ${{ github.workspace }}/newsbot-state
          CHANNEL_STATE: ${{ github.workspace }}/tmp-state
          RESEARCH_DIR: ${{ github.workspace }}/research-stats
          RESEARCH_HIST: ${{ github.workspace }}/research-hist
          PYTHONWARNINGS: ignore
        run: python newsbot/research/verify.py
      - name: Отчёт (файлы для скачивания)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-report
          path: |
            research-stats/study.json
            research-stats/verify.json
            research-stats/stats.json
            research-stats/wf.json
            research-stats/crowd_events.csv
            research-stats/weekend_rows.csv
          retention-days: 30
      - name: Оставить для бота только итоговые файлы
        run: rm -f research-stats/*.csv research-stats/*.csv.gz
      - name: Сохранить результаты для бота
        uses: actions/cache/save@v4
        with:
          path: research-stats
          key: research-stats-${{ github.run_id }}
